# Standard mihomo (Clash.Meta) config with subscription provider.
# Replace the subscription URL and secret before starting.
mixed-port: 7990
port: 7991
socks-port: 7992
redir-port: 7993
allow-lan: true
mode: global
ipv6: false
log-level: info
external-controller: 0.0.0.0:9090
secret: "1234567890"

external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

# DNS (CN)
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# TUN is disabled in this Docker deployment because the container does not
# provide a usable TUN device. Use the explicit proxy ports instead.
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true

proxy-providers:
  equal:
    type: file
    path: ./providers/equal.yaml
    interval: 3600
    health-check:
      enable: true
      interval: 600
      url: https://cp.cloudflare.com/generate_204

proxies: []

proxy-groups:
  - name: "GLOBAL"
    type: select
    use:
      - equal

rules:
  - MATCH,GLOBAL
