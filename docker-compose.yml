x-container-environment: &container-environment
  TZ: America/New_York
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  LANGUAGE: en_US:en

services:
  mihomo:
    image: docker.io/metacubex/mihomo:v1.19.32
    container_name: mihomo
    restart: unless-stopped
    environment: *container-environment
    ports:
      - "7990:7990/tcp"
      - "7990:7990/udp"
      - "7991:7991/tcp"
      - "7992:7992/tcp"
      - "7992:7992/udp"
      - "7993:7993/tcp"
      - "7993:7993/udp"
      - "1053:1053/udp"
      - "127.0.0.1:9090:9090/tcp"
    volumes:
      - ./mihomo:/root/.config/mihomo
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  metacubexd:
    image: metacubexd-local:latest
    build:
      context: .
      dockerfile: ./docker/metacubexd/Dockerfile
    container_name: metacubexd
    restart: unless-stopped
    environment:
      <<: *container-environment
      DEFAULT_BACKEND_URL: http://127.0.0.1:9090
    ports:
      - "28080:80"
    depends_on:
      - mihomo
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  provider-refresh-cron:
    build:
      context: .
      dockerfile: ./docker/provider-refresh-cron/Dockerfile
    container_name: provider-refresh-cron
    restart: unless-stopped
    depends_on:
      - mihomo
    environment:
      <<: *container-environment
      MIHOMO_CONTROLLER_URL: http://mihomo:9090
      SUB_PROXY_URL: http://mihomo:7990
      SUB_PROXY_NO_PROXY: mihomo,127.0.0.1,localhost
    volumes:
      - ./:/workspace
      - ./scripts/provider-refresh.cron:/etc/crontabs/root:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"
